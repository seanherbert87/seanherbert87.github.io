[build]
  command = "npm run build"
  publish = "out"
  # Skip the build when only documentation changed (exit 0 = skip). Only root-level *.md is
  # excluded, because blog posts in content/posts/*.md must still trigger a build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude,glob)*.md' ':!.gitignore' ':!docs/' ':!LICENCE' ':!.github/ISSUE_TEMPLATE/' ':!.github/pull_request_template.md'"

[build.environment]
  NODE_VERSION = "22"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Long-lived cache for Next.js immutable static chunks
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-lived cache for other static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages (allows updates to propagate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Umami analytics, proxied so the browser only talks to seanherbert.me.
# Must stay above the catch-all 404 rule.
[[redirects]]
  from = "/stats/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/stats/api/send"
  to = "https://cloud.umami.is/api/send"
  status = 200
  force = true

# Serve 404 for unmatched routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
